<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f5f2" />
    <meta name="description" content="A modern reimagining of MeyerWeb's classic Color Blender." />
    <title>Color Blender — Reimagined</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="Assets/images/Favicon-round-256x.png" />
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div>
          <div class="brand-line">
            <p class="eyebrow">
              <a href="https://github.com/Proyolo-ks1" target="_blank" rel="noreferrer">Proyolo-ks1</a>’s reimagining of <a href="https://github.com/meyerweb" target="_blank" rel="noreferrer">MeyerWeb</a>’s original <a class="original-link" href="https://meyerweb.com/eric/tools/color-blend/" target="_blank" rel="noreferrer">Color Blender <span aria-hidden="true">↗</span></a>
            </p>
          </div>
          <h1>Color Blender</h1>
          <p class="subtitle">Create smooth color transitions between two colors.</p>
        </div>
        <div class="header-controls" aria-label="Appearance settings">
          <button class="header-toggle" id="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark mode">
            <span id="theme-toggle-icon" aria-hidden="true">◐</span>
            <span id="theme-toggle-label">Dark mode</span>
          </button>
          <button class="header-toggle" id="gradient-toggle" type="button" aria-pressed="true" aria-label="Disable gradient background">
            <span id="gradient-toggle-label">Gradient: On</span>
          </button>
        </div>
      </header>

      <section class="workspace" aria-label="Color blender">
        <section class="panel controls-panel">
          <div class="section-heading">
            <div>
              <h2>Choose your colors</h2>
            </div>
          </div>

          <div class="color-inputs">
            <div class="color-field">
              <label for="color-a">Color 1</label>
              <div class="color-control">
                <div class="picker-wrap">
                  <button class="color-swatch" id="custom-picker-a" type="button" aria-label="Choose color 1"></button>
                  <div class="color-popover" id="popover-a" hidden>
                    <div class="color-plane" role="slider" tabindex="0" aria-label="Saturation and brightness"></div>
                    <label class="hue-control">Hue<input class="hue-slider" type="range" min="0" max="360" value="220" aria-label="Hue" /></label>
                    <button class="rebecca-color-button" type="button" aria-label="Apply Rebecca Purple (#663399)"><span class="rebecca-color-chip" aria-hidden="true"></span><span>Use Rebecca Purple</span><code>#663399</code></button>
                    <button class="native-picker-button" type="button">Use browser color picker</button>
                  </div>
                  <input class="native-color-input" id="picker-a" type="color" value="#3867d6" aria-label="Browser color picker for color 1" />
                </div>
                <input class="color-value" id="color-a" type="text" value="#3867D6" spellcheck="false" autocomplete="off" />
              </div>
            </div>
            <button class="swap-button" id="swap-colors" type="button" aria-label="Swap colors" title="Swap colors">⇄</button>
            <div class="color-field">
              <label for="color-b">Color 2</label>
              <div class="color-control">
                <div class="picker-wrap">
                  <button class="color-swatch" id="custom-picker-b" type="button" aria-label="Choose color 2"></button>
                  <div class="color-popover" id="popover-b" hidden>
                    <div class="color-plane" role="slider" tabindex="0" aria-label="Saturation and brightness"></div>
                    <label class="hue-control">Hue<input class="hue-slider" type="range" min="0" max="360" value="345" aria-label="Hue" /></label>
                    <button class="rebecca-color-button" type="button" aria-label="Apply Rebecca Purple (#663399)"><span class="rebecca-color-chip" aria-hidden="true"></span><span>Use Rebecca Purple</span><code>#663399</code></button>
                    <button class="native-picker-button" type="button">Use browser color picker</button>
                  </div>
                  <input class="native-color-input" id="picker-b" type="color" value="#eb3b5a" aria-label="Browser color picker for color 2" />
                </div>
                <input class="color-value" id="color-b" type="text" value="#EB3B5A" spellcheck="false" autocomplete="off" />
              </div>
            </div>
          </div>
          <p class="input-error" id="input-error" role="alert" aria-live="polite"></p>

          <div class="settings">
            <div class="setting">
              <label for="steps">Intermediate colors</label>
              <div class="step-control">
                <input id="steps" type="range" min="1" max="16" value="5" aria-label="Intermediate colors slider" />
                <input id="steps-number" type="number" min="1" value="5" aria-label="Number of intermediate colors" />
              </div>
            </div>
            <div class="setting">
              <label for="interpolation-mix">Interpolation blend</label>
              <div class="interpolation-blend">
                <select id="interpolation-from" aria-label="First interpolation style">
                  <option value="rgb">RGB</option>
                  <option value="linear-rgb">Linear RGB</option>
                  <option value="hsl">HSL</option>
                  <option value="hsv">HSV</option>
                  <option value="hwb">HWB</option>
                  <option value="lab">Lab</option>
                  <option value="lch">LCH</option>
                  <option value="oklab">OKLab</option>
                  <option value="oklch">OKLCH</option>
                </select>
                <div class="blend-range-control">
                  <input id="interpolation-mix" type="range" min="0" max="100" value="0" aria-label="Blend between interpolation styles" />
                  <output id="interpolation-mix-value" for="interpolation-mix">0%</output>
                </div>
                <select id="interpolation-to" aria-label="Second interpolation style">
                  <option value="hsl" selected>HSL</option>
                  <option value="rgb">RGB</option>
                  <option value="linear-rgb">Linear RGB</option>
                  <option value="hsv">HSV</option>
                  <option value="hwb">HWB</option>
                  <option value="lab">Lab</option>
                  <option value="lch">LCH</option>
                  <option value="oklab">OKLab</option>
                  <option value="oklch">OKLCH</option>
                </select>
              </div>
            </div>
          </div>
          <div class="actions">
            <button class="button button-secondary" id="reset" type="button">Reset</button>
            <div class="copy-format-wrap" id="copy-format-wrap">
              <button class="button button-primary copy-main-button" id="copy-all" type="button">Copy palette</button>
              <button class="button button-primary copy-format-toggle" id="copy-format-toggle" type="button" aria-label="Choose copy format" aria-haspopup="menu" aria-expanded="false" aria-controls="copy-format-menu">▾</button>
              <div class="copy-format-menu" id="copy-format-menu" role="menu" aria-label="Palette copy formats">
                <button type="button" role="menuitem" data-copy-format="csv">CSV <span>Comma separated</span></button>
                <button type="button" role="menuitem" data-copy-format="scsv">SCSV <span>Semicolon separated</span></button>
                <button type="button" role="menuitem" data-copy-format="tsv">TSV <span>Tab separated</span></button>
                <button type="button" role="menuitem" data-copy-format="lines">Lines <span>One color per line</span></button>
              </div>
            </div>
          </div>
          <section class="interpolation-charts" aria-label="Interpolation channel graphs">
            <figure class="channel-chart">
              <figcaption id="from-chart-title">From: RGB channels</figcaption>
              <svg id="from-chart" viewBox="0 0 340 250" role="img" aria-label="From-space channel values across the current palette"></svg>
              <p id="from-chart-scale">R/G/B: 0–255</p>
            </figure>
            <figure class="channel-chart">
              <figcaption id="to-chart-title">To: HSL channels</figcaption>
              <svg id="to-chart" viewBox="0 0 340 250" role="img" aria-label="To-space channel values across the current palette"></svg>
              <p id="to-chart-scale">H: 0–360° · S/L: 0–100%</p>
            </figure>
          </section>
        </section>

        <section class="panel palette-panel">
          <div class="section-heading palette-heading">
            <div>
              <h2>Your palette</h2>
            </div>
            <span class="palette-count" id="palette-count">7 colors</span>
          </div>
          <div class="palette-strips" aria-label="Color transition previews">
            <div class="gradient-strip" id="gradient-strip" role="img" aria-label="Smooth color gradient"></div>
            <div class="steps-strip" id="steps-strip" role="img" aria-label="Discrete palette colors"></div>
          </div>
          <div class="palette" id="palette" aria-live="polite"></div>
          <p class="palette-hint">Select a color to copy its HEX value.</p>
        </section>
      </section>

      <footer class="footer">
        <span>Independent adaptation of Eric A. Meyer's Color Blender.</span>
        <a href="https://creativecommons.org/licenses/by-sa/1.0/" target="_blank" rel="noreferrer">CC BY-SA 1.0</a>
      </footer>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>
  </body>
</html>
